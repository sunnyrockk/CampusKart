<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | CampusKart</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><main class="section"><div class="container"><div id="checkoutContent"><p class="section-tag">Final step</p><h1 class="section-title mb-4">Checkout</h1><div class="row g-4"><div class="col-lg-7"><form id="checkoutForm" class="auth-card needs-validation" novalidate><h2 class="h4 mb-4">Delivery details</h2><div class="mb-3"><label class="form-label">Full name</label><input class="form-control" required></div><div class="mb-3"><label class="form-label">Phone number</label><input type="tel" pattern="[0-9]{10}" class="form-control" required></div><div class="mb-3"><label class="form-label">Delivery address</label><textarea class="form-control" rows="3" required></textarea></div><div class="row"><div class="col-md-7 mb-3"><label class="form-label">City</label><input class="form-control" required></div><div class="col-md-5 mb-3"><label class="form-label">PIN code</label><input class="form-control" pattern="[0-9]{6}" required></div></div><button class="btn btn-primary w-100 mt-2">Place order <i class="bi bi-lock-fill ms-1"></i></button></form></div><div class="col-lg-5"><aside class="summary-card"><h2 class="h4">Order summary</h2><div id="orderItems" class="text-secondary mt-3"></div><hr><div class="d-flex justify-content-between fs-5"><strong>Total</strong><strong id="checkoutTotal" class="text-primary"></strong></div></aside></div></div></div><div id="orderSuccess" class="order-success mx-auto" style="max-width:620px"><i class="bi bi-check-circle-fill display-3"></i><h1 class="section-title mt-3">Order placed!</h1><p class="mb-4">Thanks for choosing CampusKart. Your seller will be in touch with pickup details soon.</p><a class="btn btn-primary" href="products.html">Keep browsing</a></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/script.js"></script></body></html>
