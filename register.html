<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join CampusKart</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><main class="auth-wrap"><section class="auth-card"><p class="section-tag">Join the community</p><h1 class="section-title h2">Create your account</h1><p class="text-secondary">Start buying and selling with your campus community.</p><form class="needs-validation" novalidate data-demo="Welcome to CampusKart! Your account is ready."><div class="mb-3"><label class="form-label">Full name</label><input class="form-control" required><div class="invalid-feedback">Please enter your name.</div></div><div class="mb-3"><label class="form-label">Email address</label><input type="email" class="form-control" required><div class="invalid-feedback">Enter a valid email.</div></div><div class="mb-3"><label class="form-label">Phone number</label><input type="tel" pattern="[0-9]{10}" class="form-control" required><div class="invalid-feedback">Enter a 10-digit phone number.</div></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Password</label><input type="password" minlength="6" class="form-control" required></div><div class="col-md-6 mb-3"><label class="form-label">Confirm password</label><input type="password" minlength="6" class="form-control" required></div></div><button class="btn btn-primary w-100">Create account</button></form><p class="text-center text-secondary mt-4 mb-0">Already a member? <a href="login.html">Log in</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/script.js"></script></body></html>
